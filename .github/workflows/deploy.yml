name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:          # lets you also run it by hand from the Actions tab

permissions:
  id-token: write             # needed to log in to AWS with OIDC (no stored keys)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false   # never run two deployments at the same time

env:
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_project: netflix-oss-aws
  TF_VAR_image_tag: ${{ github.sha }}
  SERVICES: "discovery-server api-gateway product-service order-service"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Point Terraform state at S3
        run: |
          cat > terraform/backend.tf <<TF
          terraform {
            backend "s3" {
              bucket       = "${{ vars.TF_STATE_BUCKET }}"
              key          = "netflix-oss-aws/terraform.tfstate"
              region       = "${{ vars.AWS_REGION }}"
              use_lockfile = true
            }
          }
          TF

      - name: Terraform init
        run: terraform -chdir=terraform init

      - name: Create ECR repositories first
        run: terraform -chdir=terraform apply -auto-approve -target=aws_ecr_repository.svc

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          for m in $SERVICES; do
            IMAGE="${{ steps.ecr.outputs.registry }}/${TF_VAR_project}/${m}:${{ github.sha }}"
            docker build --build-arg MODULE="$m" -t "$IMAGE" .
            docker push "$IMAGE"
          done

      - name: Terraform apply (rolls out the new image tag)
        run: terraform -chdir=terraform apply -auto-approve

      - name: Show the URL
        run: |
          URL=$(terraform -chdir=terraform output -raw gateway_url)
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Gateway: $URL (allow 2-3 minutes for services to register)" >> "$GITHUB_STEP_SUMMARY"
          echo "Try: \`curl $URL/api/products\`" >> "$GITHUB_STEP_SUMMARY"
